<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<title>RU Asset Database (อ่านอย่างเดียว)</title>
<style>:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --panel2: #243044;
  --border: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent2: #a78bfa;
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --keep: #34d399;
  --collection: #60a5fa;
  --bulk: #fbbf24;
  --unknown: #94a3b8;
  font-family: "Segoe UI", "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea {
  font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.45rem 0.65rem;
}
button { cursor: pointer; background: linear-gradient(180deg, #2a3a52, #1e2a3c); }
button:hover { border-color: var(--accent); }
button.primary { background: linear-gradient(180deg, #0ea5e9, #0369a1); border-color: #0284c7; font-weight: 600; }
button.danger { background: #7f1d1d; border-color: #991b1b; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: 0.75rem 1.25rem; background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
.topbar nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.topbar nav a {
  padding: 0.35rem 0.7rem; border-radius: 999px; color: var(--muted); border: 1px solid transparent;
}
.topbar nav a.active, .topbar nav a:hover {
  color: var(--text); background: var(--panel2); border-color: var(--border);
}
.main { padding: 1rem 1.25rem 2rem; max-width: 1400px; width: 100%; margin: 0 auto; }
.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem;
  margin-bottom: 1rem;
}
.row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; min-width: 160px; }
label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: var(--muted); }
label > * { color: var(--text); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
@media (max-width: 800px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
table.data {
  width: 100%; border-collapse: collapse; font-size: 0.9rem;
}
table.data th, table.data td {
  border-bottom: 1px solid var(--border); padding: 0.45rem 0.5rem; text-align: left; vertical-align: middle;
}
table.data th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
table.data tr:hover td { background: rgba(56, 189, 248, 0.06); }
.thumb { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; background: #000; }
.badge {
  display: inline-block; padding: 0.15rem 0.45rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
}
.badge.KEEP { background: rgba(52,211,153,.2); color: var(--keep); }
.badge.COLLECTION { background: rgba(96,165,250,.2); color: var(--collection); }
.badge.BULK { background: rgba(251,191,36,.2); color: var(--bulk); }
.badge.UNKNOWN { background: rgba(148,163,184,.2); color: var(--unknown); }
.dropzone {
  border: 2px dashed var(--border); border-radius: 12px; padding: 2rem; text-align: center;
  color: var(--muted); background: rgba(0,0,0,.2); transition: .15s;
}
.dropzone.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,.08); }
.muted { color: var(--muted); }
.error { color: var(--danger); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; align-items: center; }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center;
  justify-content: center; z-index: 50; padding: 1rem;
}
.modal {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  max-width: 720px; width: 100%; max-height: 90vh; overflow: auto; padding: 1rem;
}
.sticker-sheet {
  display: grid; gap: 8px; background: #fff; color: #111; padding: 12px; border-radius: 8px;
}
.sticker {
  border: 1.5px solid #222; border-radius: 3px; padding: 5px 6px; display: flex; gap: 6px;
  align-items: flex-start; overflow: hidden; page-break-inside: avoid; break-inside: avoid;
  box-sizing: border-box; background: #fff; color: #111; line-height: 1.25;
}
.sticker .meta { flex: 1; min-width: 0; padding-left: 2px; overflow: hidden; }
.sticker .name {
  font-weight: 700; line-height: 1.25; word-break: break-word; font-size: 1.05em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.sticker .name-en {
  font-weight: 500; font-size: 0.88em; line-height: 1.15; word-break: break-word; opacity: 0.85;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.sticker .code {
  font-family: ui-monospace, "Cascadia Code", monospace; font-size: 0.92em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sticker .price-line { line-height: 1.2; }
.sticker .price-thb { font-weight: 600; }
.sticker img.thumb {
  flex-shrink: 0; width: 20mm; height: auto; max-height: calc(100% - 2px);
  object-fit: contain; border-radius: 2px;
}
.sticker img.qr { flex-shrink: 0; width: 14mm; height: 14mm; object-fit: contain; }
.sticker-preview-panel { background: var(--panel); }
@media print {
  .topbar, .no-print { display: none !important; }
  .main { max-width: none; padding: 0; }
  .panel, .sticker-preview-panel { border: none; background: transparent; box-shadow: none; padding: 0; margin: 0; }
  body { background: #fff; color: #000; }
  .sticker-sheet { padding: 0; border-radius: 0; }
  .sticker { border: 1.5px solid #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}


.view-fx-bar { justify-content: space-between; }
.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.view-toggle button {
  border: none; border-radius: 0; background: var(--panel2); padding: 0.4rem 0.85rem;
}
.view-toggle button + button { border-left: 1px solid var(--border); }
.view-toggle button.toggle-active {
  background: linear-gradient(180deg, #0ea5e9, #0369a1); font-weight: 700;
}
.fx-control { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.fx-label { flex-direction: row; align-items: center; gap: 0.4rem; margin: 0; font-size: 0.85rem; }
.fx-label input { width: 5.5rem; }
.fx-hint { font-size: 0.8rem; }

.price-stack { display: flex; flex-direction: column; gap: 0.1rem; line-height: 1.2; }
.price-thb { font-weight: 700; color: var(--ok); font-size: 0.95rem; }
.price-jpy { font-size: 0.75rem; color: var(--muted); }


.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 0.85rem;
}
.card-tile {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color .15s, box-shadow .15s;
}
.card-tile:hover { border-color: var(--accent); }
.card-tile.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
}
.card-tile-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.4rem 0.5rem 0; gap: 0.35rem;
}
.card-tile-img-wrap {
  aspect-ratio: 1 / 1;
  width: 100%;
  background: #000;
  overflow: hidden;
  margin-top: 0.35rem;
}
.card-tile-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-tile-img.placeholder {
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 0.85rem; height: 100%;
}
.card-tile-body {
  padding: 0.55rem 0.65rem 0.7rem;
  display: flex; flex-direction: column; gap: 0.3rem; flex: 1;
}
.card-tile-code code { font-size: 0.8rem; }
.card-tile-name {
  font-weight: 700; font-size: 0.9rem; line-height: 1.25;
  min-height: 2.25em;
}
.card-name-primary {
  font-weight: 700;
  word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.name-jp {
  font-size: 0.72rem; font-weight: 500; margin-top: 0.1rem; opacity: 0.75;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.card-tile-meta { font-size: 0.75rem; }
.card-tile-price .price-thb { font-size: 1rem; }
.card-tile-status { width: 100%; font-size: 0.8rem; }
.card-tile-actions { margin-top: 0.25rem; font-size: 0.8rem; }
.card-tile-actions button { padding: 0.25rem 0.45rem; font-size: 0.75rem; }


.price-edit {
  display: flex; flex-direction: column; gap: 0.15rem; align-items: flex-start; min-width: 0;
}
.price-edit-input {
  width: 8ch; padding: 0.25rem 0.35rem; font-size: 0.85rem;
}
.price-edit-hint { font-size: 0.75rem; }
.card-tile-price .price-edit { width: 100%; }
.card-tile-price .price-edit-input { width: 100%; max-width: 9ch; }
.card-tile-price { display: flex; flex-direction: column; gap: 0.2rem; }
.price-edit-label { font-size: 0.7rem; }
.psa10-line { font-size: 0.85em; opacity: 0.9; }

.card-name-cell { display: flex; flex-direction: column; gap: 0.1rem; line-height: 1.25; }
.name-en { font-size: 0.8rem; font-weight: 500; }




.ver-badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 0.05rem 0.35rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  color: var(--muted);
  vertical-align: middle;
}
.card-tile-code .ver-badge { margin-left: 0.15rem; }



.collection-section { margin-bottom: 0.75rem; }
.collection-section-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
  margin-bottom: 0.65rem;
}
.collection-section-head h2 {
  margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: 0.01em;
}
.collection-active-chip {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.25rem 0.55rem; border-radius: 999px;
  background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent);
  font-size: 0.85rem; font-weight: 600;
}
.collection-active-chip button {
  padding: 0.1rem 0.4rem; font-size: 0.75rem; border-radius: 999px;
}
.collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.65rem;
}
.collection-tile {
  position: relative;
  text-align: left;
  background-color: var(--panel2);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0;
  display: flex; flex-direction: column;
  min-height: 7.5rem;
  overflow: hidden;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, background-color .15s;
}
.collection-tile:hover {
  border-color: var(--accent);
}
.collection-tile:not(.has-bg):hover {
  background-color: rgba(56, 189, 248, 0.08);
}
.collection-tile.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
}
.collection-tile:not(.has-bg).active {
  background-color: rgba(56, 189, 248, 0.12);
}
.collection-tile-overlay {
  flex: 1;
  display: flex; flex-direction: column; gap: 0.25rem;
  padding: 0.7rem 0.75rem;
  padding-right: 3.2rem;
  background: linear-gradient(
    160deg,
    rgba(8, 12, 20, 0.55) 0%,
    rgba(8, 12, 20, 0.72) 55%,
    rgba(8, 12, 20, 0.82) 100%
  );
  min-height: inherit;
  box-sizing: border-box;
}
.collection-tile:not(.has-bg) .collection-tile-overlay {
  background: transparent;
}
.collection-tile-code {
  font-family: ui-monospace, "Cascadia Code", monospace;
  font-weight: 800; font-size: 1.05rem; letter-spacing: 0.03em;
  color: var(--accent);
  text-shadow: 0 1px 2px rgba(0,0,0,0.45);
}
.collection-tile-count {
  font-size: 0.8rem; color: var(--muted);
  text-shadow: 0 1px 2px rgba(0,0,0,0.35);
}
.collection-tile-name {
  font-size: 0.75rem; color: var(--text); line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  opacity: 0.95;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.collection-tile-actions {
  position: absolute;
  top: 0.35rem;
  right: 0.35rem;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  align-items: stretch;
}
.collection-tile-upload,
.collection-tile-clear {
  font-size: 0.68rem;
  padding: 0.12rem 0.35rem;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.55);
  color: #e2e8f0;
  cursor: pointer;
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
}
.collection-tile-upload:hover,
.collection-tile-clear:hover {
  border-color: var(--accent);
  color: #fff;
  background: rgba(0,0,0,0.75);
}
.collection-tile-clear {
  border-color: rgba(248, 113, 113, 0.45);
  color: #fecaca;
}
.collection-empty {
  padding: 1.5rem 1rem; text-align: center; color: var(--muted);
  border: 1px dashed var(--border); border-radius: 12px; background: rgba(0,0,0,.15);
}
.link-quiet {
  background: none; border: none; color: var(--muted); text-decoration: underline;
  padding: 0.2rem 0.35rem; font-size: 0.8rem; cursor: pointer;
}
.link-quiet:hover { color: var(--accent); border-color: transparent; }



.qty-edit {
  display: inline-flex; align-items: center; gap: 0.25rem;
}
.qty-edit-input {
  width: 5ch; padding: 0.25rem 0.35rem; font-size: 0.85rem; text-align: center;
}
.qty-edit-hint { font-size: 0.75rem; }
.card-tile-qty-price {
  display: flex; flex-direction: column; gap: 0.35rem; margin: 0.35rem 0;
}
.card-tile-qty-price .qty-edit { width: 100%; }
.card-tile-qty-price .qty-edit-input { max-width: 6ch; }


.jump-pool-head { display:flex; flex-wrap:wrap; align-items:center; gap:1rem; justify-content:space-between; }
.jump-pool-summary { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; }
.jump-pool-layout { display:grid; grid-template-columns:minmax(300px, 42%) minmax(0, 1fr); gap:1rem; align-items:start; }
.jump-collection-panel { position:sticky; top:5rem; max-height:calc(100vh - 6rem); overflow:auto; }
.jump-card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:.65rem; margin-top:.75rem; }
.jump-card { display:flex; flex-direction:column; gap:.25rem; padding:.45rem; background:var(--panel2); border:1px solid var(--border); border-radius:10px; cursor:grab; font-size:.78rem; }
.jump-card:active { cursor:grabbing; }
.jump-card img,.jump-card-image { width:100%; aspect-ratio:2 / 3; object-fit:cover; border-radius:6px; background:#000; display:flex; align-items:center; justify-content:center; color:var(--muted); }
.jump-card strong { line-height:1.2; min-height:2.4em; overflow:hidden; }
.jump-card span { color:var(--muted); font-size:.7rem; }
.jump-card-actions { display:flex; flex-wrap:wrap; gap:.2rem; }
.jump-card-actions button { font-size:.65rem; padding:.2rem .3rem; }
.jump-tier-column { display:flex; flex-direction:column; gap:.7rem; }
.jump-tier { margin:0; }
.jump-tier-head { display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem; }
.jump-tier-head input { flex:1; font-weight:700; }
.jump-tier-head span { color:var(--muted); font-size:.8rem; white-space:nowrap; }
.jump-drop-hint { border:1px dashed var(--border); padding:.75rem; text-align:center; margin:.25rem 0; }
.jump-pool-card { display:flex; align-items:center; gap:.55rem; padding:.4rem; margin:.35rem 0; border:1px solid var(--border); border-radius:8px; background:var(--panel2); }
.jump-pool-card img,.jump-pool-card .jump-card-image { width:48px; height:70px; flex:none; aspect-ratio:auto; }
.jump-pool-card-info { display:flex; flex-direction:column; gap:.15rem; min-width:0; flex:1; font-size:.78rem; }
.jump-pool-card-info strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.jump-pool-card-info span { color:var(--muted); }
.jump-pool-card-info label { flex-direction:row; align-items:center; gap:.3rem; font-size:.75rem; }
.jump-pool-card > button { padding:.15rem .4rem; }
.jump-entry-fields { display:flex; flex-wrap:wrap; gap:.35rem .55rem; margin:.25rem 0; }
.jump-entry-fields label { display:flex; flex-direction:row; align-items:center; gap:.3rem; font-size:.75rem; }
.jump-entry-fields input { width:6.5rem; }
.jump-probability { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin-top:.55rem; padding-top:.45rem; border-top:1px solid var(--border); font-size:.75rem; }
.jump-probability span { color:var(--accent); }
.jump-workspace { border:0; padding:0; margin:0; min-inline-size:0; }
@media (max-width: 950px) { .jump-pool-layout { grid-template-columns:1fr; } .jump-collection-panel { position:static; max-height:none; } }


.card-tile-qty-price {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.4rem 0.35rem;
  align-items: start;
  margin: 0.35rem 0;
}
.card-tile-qty-price .tile-field {
  display: flex; flex-direction: column; gap: 0.12rem; min-width: 0;
}
.card-tile-qty-price .price-edit-label {
  font-size: 0.66rem; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-tile-qty-price .price-edit,
.card-tile-qty-price .qty-edit {
  position: relative; display: flex; flex-direction: column; align-items: stretch;
  gap: 0.1rem; width: 100%; min-width: 0;
}
.card-tile-qty-price .price-edit-input,
.card-tile-qty-price .qty-edit-input,
.card-tile-qty-price .card-tile-status {
  width: 100%; max-width: none; min-width: 0;
  padding: 0.22rem 0.3rem; font-size: 0.78rem; border-radius: 6px;
  height: 1.85rem;
}
.card-tile-qty-price .qty-edit-input { text-align: left; }

.card-tile-qty-price .price-edit--baht .price-edit-input { padding-right: 1.9rem; }
.card-tile-qty-price .qty-edit-input { padding-right: 1.2rem; }
.card-tile-qty-price .price-edit-unit,
.card-tile-qty-price .qty-edit-hint {
  position: absolute; right: 0.3rem; top: 0; height: 1.85rem;
  display: flex; align-items: center;
  font-size: 0.66rem; pointer-events: none; white-space: nowrap;
}

.card-tile-qty-price .price-edit > .price-thb,
.card-tile-qty-price .price-edit > .price-edit-hint:not(.price-edit-unit) {
  font-size: 0.68rem; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.card-tile-qty-price .card-tile-status { padding-right: 0.1rem; text-overflow: ellipsis; }

.card-tile-qty-price input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.card-tile-qty-price input[type=number]::-webkit-outer-spin-button,
.card-tile-qty-price input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }


img.zoomable { cursor: zoom-in; }
.lightbox-backdrop {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(2, 6, 12, 0.88);
  display: flex; align-items: center; justify-content: center;
  padding: 2.5vh 2.5vw; cursor: zoom-out;
  animation: lightbox-fade .12s ease-out;
}
@keyframes lightbox-fade { from { opacity: 0; } to { opacity: 1; } }
.lightbox-figure {
  margin: 0; display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
  max-width: 90vw; max-height: 95vh; cursor: default;
}
.lightbox-img {
  display: block; max-width: 90vw; max-height: calc(90vh - 3.5rem);
  width: auto; height: auto; object-fit: contain;
  border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); background: #000;
}
.lightbox-caption {

.ra-chip.new{background:rgba(167,139,250,.2);color:#c4b5fd}
.ra-chip.del{background:#7f1d1d;color:#fecaca}
.ra-chip.warn{background:rgba(251,191,36,.18);color:var(--warn)}

.ra-card-photo .ra-photo,.ra-card-photo .ra-photo-empty{position:absolute;inset:0;height:100%}

.ra-phlist{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.ra-phit{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.ra-phit .ra-photo{width:100%;height:100%}
.ra-phit button{position:absolute;top:2px;right:2px;width:22px;height:22px;padding:0;border-radius:50%;font-size:.7rem;line-height:1;background:rgba(127,29,29,.9);border-color:#991b1b}
.ra-item{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:1.25rem;align-items:start}

.qrbox svg{width:100%;height:100%;display:block}
.ra-sticker .qrbox{align-self:center;flex-shrink:0}
.ra-sticker-tag.long{white-space:normal;overflow-wrap:anywhere;font-size:1.35em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:clip}
