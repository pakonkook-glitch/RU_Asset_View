<!doctype html><html lang="th"><meta charset="utf-8"><title>RU API transport check</title><body><pre id="out">TESTING</pre><script>
(async function(){
const u='https://script.google.com/macros/s/AKfycbx1We4PSXL5kQ2LT4eQAWenetJdubtGce8W2J_VhIMDPS7qU0LaHYbwjlHidJycJtfS9A/exec';
const o=document.getElementById('out');
try {
const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getAssets',token:'INVALID-TEST-TOKEN-NO-ACCESS'}),redirect:'follow',cache:'no-store'});
const t=await r.text();o.textContent='TRANSPORT_OK '+r.status+' '+t.slice(0,150);
} catch(e){o.textContent='TRANSPORT_FAILED '+String(e)}
})();
</script></body></html>
